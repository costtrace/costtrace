name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please don't paste real billing data or credentials.** Redact account IDs and resource names, or reproduce with `examples/sample`.
        Security issues: see [SECURITY.md](https://github.com/costtrace/costtrace/security/policy) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command or code, and the output (redacted).
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npm ls costtrace @costtrace/mcp` or `npx costtrace --version`
  - type: dropdown
    id: source
    attributes:
      label: Billing source
      options: [Local file or folder, AWS (S3), Azure (Blob Storage), Google Cloud (BigQuery), Oracle Cloud, Not applicable]
  - type: input
    id: node
    attributes:
      label: Node.js version

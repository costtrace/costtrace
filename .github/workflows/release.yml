name: Release

# Stages all packages on npm when a version tag (v1.2.3) is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere, and
# npm attaches provenance linking each package to this workflow run.
# Staged packages go live only after a maintainer approves them with 2FA,
# so a compromised workflow or tag push alone cannot release anything.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for pkg in focus core aws azure gcp cli; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "v$version" != "$TAG" ]; then
              echo "::error::packages/$pkg is $version but the tag is $TAG"
              exit 1
            fi
          done

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npm stage publish -w @costtrace/focus --access public
      - run: npm stage publish -w @costtrace/core --access public
      - run: npm stage publish -w @costtrace/aws --access public
      - run: npm stage publish -w @costtrace/azure --access public
      - run: npm stage publish -w @costtrace/gcp --access public
      - run: npm stage publish -w costtrace --access public

      - name: Approval instructions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## $TAG staged on npm — approval needed"
            echo
            echo "Approve **in this order**: focus first, the CLI last (dependencies before dependents):"
            echo
            echo '```bash'
            echo 'npm stage list @costtrace/focus    # then: npm stage approve <stage-id>'
            echo 'npm stage list @costtrace/core'
            echo 'npm stage list @costtrace/aws'
            echo 'npm stage list @costtrace/azure'
            echo 'npm stage list @costtrace/gcp'
            echo 'npm stage list costtrace'
            echo '```'
            echo
            echo "Or approve each package on npmjs.com."
          } >> "$GITHUB_STEP_SUMMARY"
